{% extends "hrm_app/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h3>{{ title|default:"Apply for Leave" }}</h3>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary">Submit</button>
    <a class="btn btn-secondary" href="{% url 'hrm:leave_list' %}">Cancel</a>
  </form>
{% endblock %}
