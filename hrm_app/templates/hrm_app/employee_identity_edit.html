{% extends "hrm_app/base.html" %}

{% block content %}

<div class="employee-card">

<h3>Edit Identity Details</h3>

<p class="text-muted">
  {{ employee.user.get_full_name }} ({{ employee.employee_id }})
</p>

<hr>
<div class="form-container">

<form method="post">
{% csrf_token %}

<div class="form-row">
<label>Aadhar Number</label>
{{ form.aadhar_number }}
</div>

<div class="form-row">
<label>PAN Number</label>
{{ form.pan_number }}
</div>

<div class="form-actions">
<button class="btn btn-success">Save</button>

<a href="{% url 'hrm:employee_profile' employee.id %}" class="btn btn-secondary">
Cancel
</a>

</div>

</form>

</div>
</div>

{% endblock %}
