{% extends "hrm_app/base.html" %}
{% block content %}

<h3>Update Photo – {{ employee.user.get_full_name }}</h3>
<hr>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}

  <button class="btn btn-primary">Save</button>
  <a href="{% url 'hrm:employee_profile' employee.id %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
