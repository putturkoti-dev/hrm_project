{% extends "base_public.html" %}
{% load static %}

{% block content %}
<style>
.login-wrapper {
    max-width: 900px;
    margin: 60px auto;
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

.login-left {
    background: #fdebd2;
    width: 50%;
    padding: 40px;
    text-align: center;
}

.login-left img {
    width: 400px;
    margin-bottom: 20px;
}

.login-right {
    width: 50%;
    padding: 40px;
}

.login-right h3 {
    margin-bottom: 20px;
}

.login-right input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
}

.login-btn {
    background: #0d6efd;
    color: white;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 5px;
}
</style>

<div class="login-container">

<div class="login-left">

<h2>Welcome To</h2>
<h3 style="color:#f15a22;">pk HRM</h3>

<img src="{% static 'hrm_app/images/csc_logo.png' %}">

<p class="mt-4">Gateway to Organize</p>
<small>Secure authentication system</small>

</div>


<div class="login-right">

<h4 class="mb-4">Log in to your account</h4>

<form method="post">
{% csrf_token %}

<label>Username</label>
{{ form.username }}

<label>Password</label>
{{ form.password }}

<button class="login-btn mt-3">Login</button>

</form>

<div class="mt-3">

<a href="#">Forgot password?</a>

<p class="mt-2">
New Organization ?
<a href="{% url 'hrm:company_signup' %}">
Sign Up (Company)
</a>
</p>

</div>

</div>

</div>

{% endblock %}
