{% extends "hrm_app/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<h4>Reporting Manager — {{ employee.user.get_full_name }}</h4>
<hr>

<form method="post">
  {% csrf_token %}
  {{ form|crispy }}

  <button type="submit" class="btn btn-primary">
    Save
  </button>

  <a href="{% url 'hrm:employee_profile' employee.id %}"
     class="btn btn-secondary">
     Cancel
  </a>
</form>
{% endblock %}
