{% extends "hrm_app/base.html" %}

{% block content %}

<div class="employee-card">

<h3>Edit Bank Details</h3>

<p class="text-muted">
  {{ employee.user.get_full_name }} ({{ employee.employee_id }})
</p>

<hr>
<div class="form-container">

<form method="post">
{% csrf_token %}

    <div class="form-row">
<label>Bank Name</label>
{{ form.bank_name }}
</div>

<div class="form-row">
<label>Account Number</label>
{{ form.account_number }}
</div>

<div class="form-row">
<label>IFSC Code</label>
{{ form.ifsc_code }}
</div>

<div class="form-row">
<label>Salary</label>
{{ form.salary }}
</div>

<div class="form-actions">
<button class="btn btn-success">Save</button>

<a href="{% url 'hrm:employee_profile' employee.id %}" class="btn btn-secondary">
Cancel
</a>

</div>

</form>

</div>
</div>

{% endblock %}
