{% extends "hrm_app/base.html" %}

{% block content %}
<h3>Are you sure you want to delete this employee?</h3>

<p><strong>{{ employee.user.first_name }} {{ employee.user.last_name }}</strong></p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'hrm:employee_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
