<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}HRM{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background: linear-gradient(135deg,#1f2d3d,#34495e);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:system-ui;
}

.login-container{
background:white;
border-radius:14px;
overflow:hidden;
max-width:950px;
width:100%;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
display:flex;
}

.login-left{
background:#fdebd2;
width:50%;
padding:50px;
text-align:center;
}

.login-left img{
width:280px;
margin-top:30px;
}

.login-right{
width:50%;
padding:50px;
}

.login-right input{
width:100%;
padding:12px;
border-radius:6px;
border:1px solid #ddd;
margin-bottom:15px;
}

.login-btn{
width:100%;
padding:12px;
background:#0d6efd;
border:none;
color:white;
border-radius:6px;
font-weight:600;
}

.login-btn:hover{
background:#0b5ed7;
}

</style>

</head>

<body>

{% block content %}{% endblock %}

</body>
</html>
